<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="520" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="popupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="520" height="380" rx="20" fill="url(#bgGrad)"/>

  <!-- Browser window -->
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="440" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="40" y="30" width="440" height="36" rx="12" fill="#f8fafc"/>
    <rect x="40" y="54" width="440" height="12" fill="#f8fafc"/>
    <circle cx="58" cy="48" r="5" fill="#ef4444"/>
    <circle cx="74" cy="48" r="5" fill="#f59e0b"/>
    <circle cx="90" cy="48" r="5" fill="#22c55e"/>
    <rect x="120" y="40" width="280" height="16" rx="8" fill="#e2e8f0"/>
    <text x="160" y="52" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">chatgpt.com</text>

    <!-- ChatGPT sidebar -->
    <rect x="40" y="66" width="100" height="264" fill="#f8fafc"/>
    <rect x="52" y="82" width="76" height="10" rx="3" fill="#e2e8f0"/>
    <rect x="52" y="100" width="60" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="52" y="116" width="68" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="52" y="132" width="52" height="8" rx="2" fill="#e2e8f0"/>

    <!-- Chat area -->
    <rect x="140" y="66" width="340" height="264" fill="#ffffff"/>
    <rect x="156" y="86" width="200" height="12" rx="4" fill="#0f172a" opacity="0.85"/>
    <rect x="156" y="108" width="280" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="124" width="260" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="140" width="240" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="156" width="270" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="172" width="200" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="200" width="180" height="10" rx="4" fill="#2563eb" opacity="0.7"/>
    <rect x="156" y="220" width="250" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="236" width="230" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="252" width="210" height="8" rx="2" fill="#cbd5e1"/>
    <rect x="156" y="290" width="308" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  </g>

  <!-- AyaPDF popup -->
  <g filter="url(#popupShadow)">
    <rect x="280" y="120" width="180" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="280" y="120" width="180" height="44" rx="12" fill="#f8fafc"/>
    <rect x="280" y="152" width="180" height="12" fill="#f8fafc"/>
    <circle cx="302" cy="142" r="12" fill="#7c3aed"/>
    <text x="298" y="146" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="white">A</text>
    <text x="320" y="146" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">AyaPDF</text>

    <rect x="296" y="178" width="148" height="32" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="308" y="198" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">Export current response</text>

    <rect x="296" y="218" width="148" height="32" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="308" y="238" font-family="Segoe UI, sans-serif" font-size="9" fill="#334155">Export entire conversation</text>

    <rect x="296" y="268" width="148" height="36" rx="8" fill="#2563eb"/>
    <text x="318" y="291" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="white">Export to PDF</text>
  </g>
</svg>
